<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Loup-Garou</title>
<!--
  HUD fixe du Loup-Garou (loup_garou/hud.lua) : bandeau de phase et minuteur,
  revelation du role (la carte se retourne), rappel du role, message
  transitoire, panneau du salon. Ce qui suit les tetes est au Canvas.
-->
<style>
@font-face { font-family: "Lilita One"; src: url("../vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --laiton: #d9b56a; --laiton-fonce: #8a6d3b; --ombre: #070a0b; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Lilita One", sans-serif; color: var(--encre); user-select: none; pointer-events: none; }
body.apercu { background: radial-gradient(circle at 50% 35%, #3b4a5e, #11161f); }
.cache { display: none !important; }

.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); opacity: .7; }
.sk-svg .fond { fill: var(--papier); }
.sk-svg .trait { fill: none; stroke: var(--encre); stroke-width: 3.5px; stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--encre); stroke-width: 1.5px; opacity: .4; }
.touche { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px; box-sizing: border-box;
    border: 2.5px solid var(--encre); border-bottom-width: 5px; border-radius: 8px; background: #f6eedb; font-size: 17px; line-height: 1; }

/* Bandeau de phase, en haut au centre. */
#phase { position: absolute; top: 28px; left: 50%; transform: translateX(-50%) rotate(-1deg); display: flex; align-items: center; gap: 16px;
    padding: 12px 18px 12px 22px; font-size: 30px; white-space: nowrap; }
#phase .ico { width: 40px; height: 40px; }
#minuteur { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; background: var(--encre); color: var(--papier);
    font-size: 23px; box-shadow: inset 0 0 0 3px var(--laiton); }
#minuteur.presse { color: #ffb3a8; box-shadow: inset 0 0 0 3px #b8332d; }

/* Rappel du role, en bas a gauche. */
#role { position: absolute; left: 36px; bottom: 34px; display: flex; align-items: flex-end; gap: 14px; }
#role img { width: 110px; transform: rotate(-7deg); filter: drop-shadow(5px 6px 0 rgba(7, 10, 11, .7)); }
#role .sk { padding: 10px 16px; font-size: 25px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
#role small { font-size: 16px; color: var(--laiton-fonce); }
#role small:empty { display: none; }
#role small { white-space: pre-line; line-height: 1.25; }

/* Message transitoire, en bas au centre : blanc avec ombre. */
#message { position: absolute; left: 0; right: 0; bottom: 42px; text-align: center; font-size: 24px; color: #fff;
    text-shadow: 2px 2px 0 #000, 0 0 10px rgba(0, 0, 0, .6); transition: opacity .4s; }
#message.efface { opacity: 0; }
#message .touche { text-shadow: none; margin: 0 3px; color: var(--encre); }

/* Revelation du role : la carte arrive de dos et se retourne. */
#revelation { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 10, 11, .55); transition: opacity .5s; }
#revelation.efface { opacity: 0; }
#revelation .scene { display: flex; flex-direction: column; align-items: center; gap: 26px; }
#carte { width: 300px; height: 451px; perspective: 1200px; }
#carte .interieur { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(180deg) scale(.6); }
#carte.tourne .interieur { transition: transform 1s cubic-bezier(.2, .8, .2, 1.1); transform: rotateY(0deg) scale(1); }
#carte img { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; filter: drop-shadow(10px 12px 0 rgba(7, 10, 11, .7)); }
#carte img.dos { transform: rotateY(180deg); }
#titre-role { font-size: 64px; color: var(--papier); -webkit-text-stroke: 10px var(--encre); paint-order: stroke fill; text-shadow: 7px 8px 0 var(--ombre); }
#allies { font-size: 26px; color: #fff; text-shadow: 2px 2px 0 #000; }
#allies:empty { display: none; }

/* Salon : meme panneau que Liar's Bar. */
#salon { position: absolute; left: 40px; top: 50%; transform: translateY(-50%) rotate(-1deg); width: 330px; padding: 18px 20px;
    display: flex; flex-direction: column; gap: 12px; }
#salon .ligne { display: flex; align-items: center; gap: 10px; font-size: 26px; }
#salon .compte { font-size: 18px; color: var(--laiton-fonce); }
#reglages { display: flex; flex-direction: column; gap: 3px; }
.reglage { display: flex; align-items: center; gap: 8px; font-size: 17px; padding: 3px 8px; border-radius: 8px; }
.reglage img { width: 20px; }
.reglage .nom { flex: 1; }
.reglage .val { display: inline-flex; align-items: center; gap: 6px; min-width: 64px; justify-content: flex-end; }
.reglage .fl { color: var(--laiton-fonce); visibility: hidden; }
.reglage.choisie { background: var(--laiton); }
.reglage.choisie .fl { visibility: visible; color: var(--encre); }
.reglage.villageois { color: var(--laiton-fonce); }
#places { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.place { display: flex; align-items: center; gap: 6px; font-size: 16px; padding: 5px 8px; border-radius: 8px; background: rgba(28, 33, 35, .07);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place.pret { background: var(--laiton); }
.place.moi { outline: 2px solid var(--encre); }
.place.vide { opacity: .45; }
#salon .aide { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 15px; align-items: center; }
#salon .aide span { display: inline-flex; gap: 6px; align-items: center; }

/* Vision de la voyante : la carte monte du bas, se retourne, redescend. */
#vision { position: absolute; inset: 0; display: grid; place-items: center; }
#vision .scene { display: flex; flex-direction: column; align-items: center; gap: 18px;
    transform: translateY(110vh) rotate(9deg); }
#vision.monte .scene { transform: translateY(0) rotate(-2deg); transition: transform .75s cubic-bezier(.2, .9, .25, 1.12); }
#vision.part .scene { transform: translateY(110vh) rotate(-11deg); transition: transform .6s cubic-bezier(.6, -.25, .8, .4); }
#vcarte { width: 240px; height: 361px; perspective: 1200px; }
#vcarte .interieur { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(180deg); }
#vcarte.tourne .interieur { transform: rotateY(0deg); transition: transform .8s cubic-bezier(.2, .8, .2, 1.1); }
#vcarte img { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden;
    filter: drop-shadow(9px 11px 0 rgba(7, 10, 11, .7)); }
#vcarte img.dos { transform: rotateY(180deg); }
#vtitre { font-size: 44px; color: var(--papier); -webkit-text-stroke: 8px var(--encre); paint-order: stroke fill;
    text-shadow: 6px 7px 0 var(--ombre); opacity: 0; transition: opacity .3s; }
#vcarte.tourne + #vtitre { opacity: 1; transition-delay: .5s; }

/* Un role dans un texte : sa couleur. */
.role-villager { color: #e8d6a8; } .role-seer { color: #b58cf0; } .role-wolf { color: #e0564b; }
.role-white_wolf { color: #e6f0ff; } .role-hunter { color: #8cc063; } .role-witch { color: #5fd0a8; }
.role-guard { color: #6fa3f0; } .role-cupid { color: #f38bb6; }
[class^="role-"] { white-space: nowrap; }
#res-recit .role-villager { color: #a08a55; } #res-recit .role-white_wolf { color: #7f93b3; }

/* Annonce (aube, execution, chasseur...) : au milieu de l'ecran. */
#annonce { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-1.5deg); max-width: 72%; text-align: center;
    font-size: 46px; line-height: 1.15; color: var(--papier); -webkit-text-stroke: 8px var(--encre); paint-order: stroke fill;
    text-shadow: 5px 6px 0 var(--ombre); transition: opacity .5s, top .5s; }
#annonce.efface { opacity: 0; top: 41%; }

/* Elimine : un tampon au centre, qui file ensuite dans le coin. */
#elimine { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) rotate(-8deg); font-size: 96px; color: #d4453a;
    -webkit-text-stroke: 10px var(--encre); paint-order: stroke fill; text-shadow: 7px 8px 0 var(--ombre);
    transition: top .7s, left .7s, font-size .7s, transform .7s; }
#elimine.coin { top: 140px; left: calc(100% - 150px); transform: translate(-50%, -50%) rotate(-6deg); font-size: 34px; -webkit-text-stroke: 6px var(--encre); }

/* Fin de partie : victoire ou defaite, les roles, les gains, le recit. */
#resultat { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 10, 11, .62); pointer-events: auto; }
#resultat .panneau { width: min(900px, 90vw); padding: 24px 30px 26px; display: flex; flex-direction: column; gap: 12px; }
#res-titre { font-size: 66px; text-align: center; color: #d9b56a; -webkit-text-stroke: 9px var(--encre); paint-order: stroke fill;
    text-shadow: 6px 7px 0 var(--ombre); }
#res-titre.defaite { color: #d4453a; }
#res-sous { text-align: center; font-size: 22px; }
#res-sous .plus { color: #2f7a35; } #res-sous .moins { color: #b8332d; }
#res-corps { display: grid; grid-template-columns: 1fr 1.15fr; gap: 20px; }
#res-joueurs, #res-recit { max-height: 50vh; overflow-y: auto; }
#res-corps h3 { margin: 0 0 6px; font-size: 22px; font-weight: normal; color: var(--laiton-fonce); }
.res-j { display: flex; align-items: center; gap: 8px; font-size: 18px; padding: 4px 8px; border-radius: 8px; }
.res-j img { width: 26px; }
.res-j .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-j .r { font-size: 14px; color: var(--laiton-fonce); }
.res-j.mort .n { color: #7b7466; font-style: italic; }
.res-j.gagne { background: rgba(217, 181, 106, .4); }
.res-j .g { min-width: 58px; text-align: right; font-size: 16px; }
.res-j .g.plus { color: #2f7a35; } .res-j .g.moins { color: #b8332d; }
#res-recit h4 { margin: 10px 0 3px; font-size: 20px; font-weight: normal; }
#res-recit h4:first-child { margin-top: 0; }
#res-recit p { margin: 2px 0; font-size: 16px; line-height: 1.3; }
#res-fermer { position: absolute; top: 10px; right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--encre);
    background: #f6eedb; font: inherit; font-size: 26px; line-height: 1; cursor: pointer; }
#res-fermer:hover { background: var(--laiton); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="lune" viewBox="0 0 40 40"><path d="M26 5a15 15 0 1 0 9 22A13 13 0 0 1 26 5z" fill="#d9b56a" stroke="#1c2123" stroke-width="2.6" stroke-linejoin="round"/></symbol>
  <symbol id="soleil" viewBox="0 0 40 40"><circle cx="20" cy="20" r="8" fill="#d9b56a" stroke="#1c2123" stroke-width="2.6"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4" stroke="#1c2123" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="coche" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1c2123" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="phase" class="sk cache" data-graine="61" data-rayon="18">
  <svg class="ico"><use id="phase-ico" href="#lune"/></svg><span id="phase-texte"></span><span id="minuteur"></span>
</div>

<div id="role" class="cache"><img id="role-img" alt=""><div class="sk" data-graine="67" data-rayon="14"><span id="role-nom"></span><small id="role-petit"></small></div></div>

<div id="message" class="efface"></div>

<div id="revelation" class="cache">
  <div class="scene">
    <div id="carte"><div class="interieur"><img id="carte-face" alt=""><img class="dos" src="img/dos_nuit.png" alt=""></div></div>
    <div id="titre-role"></div>
    <div id="allies"></div>
  </div>
</div>

<div id="vision" class="cache">
  <div class="scene">
    <div id="vcarte"><div class="interieur"><img id="vcarte-face" alt=""><img class="dos" src="img/dos_nuit.png" alt=""></div></div>
    <div id="vtitre"></div>
  </div>
</div>

<div id="annonce" class="efface"></div>
<div id="elimine" class="cache">Éliminé</div>

<div id="resultat" class="cache">
  <div class="panneau sk" data-graine="97" data-rayon="18">
    <button id="res-fermer" aria-label="Fermer">✕</button>
    <div id="res-titre"></div>
    <div id="res-sous"></div>
    <div id="res-corps"><div id="res-joueurs"></div><div id="res-recit"></div></div>
  </div>
</div>

<div id="salon" class="sk cache" data-graine="83" data-rayon="16">
  <div class="ligne"><svg width="34" height="34"><use href="#lune"/></svg><span>Loup-Garou</span><span style="flex: 1"></span><span class="compte" id="salon-compte"></span></div>
  <div id="places"></div>
  <div id="reglages"></div>
  <div class="aide" id="salon-aide"></div>
</div>

<script src="../ui/esquisse.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const nettoyer = (s) => String(s == null ? "" : s).replace(/[<>&]/g, "");
const montrer = (id, oui) => $(id).classList.toggle("cache", !oui);
const retracer = () => requestAnimationFrame(habiller);
// Texte venu du serveur, nettoye, ses roles ([[wolf|Loup-Garou]]) en couleur.
const avecRoles = (s) => nettoyer(s).replace(/\[\[([a-z_]+)\|([^\]]+)\]\]/g, '<span class="role-$1">$2</span>');

// ---------------------------------------------------------------- phase et minuteur
let finPhase = 0, minuteurActif = false;
function phase(p) {
  if (!p) { montrer("phase", false); minuteurActif = false; return; }
  $("phase-ico").setAttribute("href", p.icone === "soleil" ? "#soleil" : "#lune");
  $("phase-texte").textContent = p.texte || "";
  finPhase = p.duree ? performance.now() + p.duree * 1000 : 0;
  minuteurActif = !!p.duree;
  montrer("minuteur", minuteurActif);
  montrer("phase", true);
  tic();
  retracer();
}
// Le minuteur de la phase en cours change (tout le monde a vote).
function chrono(reste) {
  finPhase = performance.now() + reste * 1000;
  minuteurActif = true;
  montrer("minuteur", true);
  tic();
}
function tic() {
  if (!minuteurActif) return;
  const reste = Math.max(0, Math.ceil((finPhase - performance.now()) / 1000));
  $("minuteur").textContent = `${Math.floor(reste / 60)}:${String(reste % 60).padStart(2, "0")}`;
  $("minuteur").classList.toggle("presse", reste <= 10);
}
setInterval(tic, 250);

// ---------------------------------------------------------------- role
function rappel(r) {
  if (!r) { montrer("role", false); return; }
  $("role-img").src = `img/${r.image}.png`;
  $("role-nom").textContent = r.nom || "";
  $("role-petit").textContent = r.petit || "";
  montrer("role", true);
  retracer();
}

// La carte arrive de dos, se retourne, reste un moment, puis part : le
// rappel en bas a gauche prend le relais.
let finRevelation = null;
function revelation(r) {
  clearTimeout(finRevelation);
  $("carte-face").src = `img/${r.image}.png`;
  $("titre-role").textContent = `Tu es ${r.article || ""}${r.nom}`;
  $("allies").textContent = r.allies || "";
  const carte = $("carte");
  carte.classList.remove("tourne");
  $("revelation").classList.remove("efface");
  montrer("revelation", true);
  montrer("role", false);
  setTimeout(() => carte.classList.add("tourne"), 600);
  finRevelation = setTimeout(() => {
    $("revelation").classList.add("efface");
    setTimeout(() => { montrer("revelation", false); rappel(r); }, 500);
  }, 4800);
}

// ---------------------------------------------------------------- message
let finMessage = null;
function message(texte, secondes) {
  clearTimeout(finMessage);
  $("message").innerHTML = nettoyer(texte).replace(/\[([^\]]+)\]/g, '<span class="touche">$1</span>');
  $("message").classList.toggle("efface", !texte);
  if (texte && secondes !== 0) finMessage = setTimeout(() => $("message").classList.add("efface"), (secondes || 4) * 1000);
}

// ---------------------------------------------------------------- salon
function salon(v) {
  if (!v) { montrer("salon", false); return; }
  const joueurs = v.joueurs || [];
  $("salon-compte").textContent = `${joueurs.length}/${v.max || 12}`;
  // Reglages de la partie : le createur les change (fleches), les autres
  // les voient. Les villageois completent.
  const lignes = (v.lignes || []).map((l) => `<div class="reglage${l.choisie ? " choisie" : ""}">`
    + (l.image ? `<img src="img/${l.image}.png" alt="">` : "")
    + `<span class="nom">${nettoyer(l.nom)}</span><span class="val"><span class="fl">‹</span>${nettoyer(l.valeur)}<span class="fl">›</span></span></div>`);
  lignes.push(`<div class="reglage villageois"><img src="img/villageois.png" alt=""><span class="nom">Villageois</span><span class="val">${v.villageois || 0}</span></div>`);
  $("reglages").innerHTML = lignes.join("");
  const T = (k) => `<span class="touche">${k}</span>`;
  $("salon-aide").innerHTML = `<span>${T("R")}<svg width="18" height="18"><use href="#coche"/></svg></span>`
    + (v.createur ? `<span>${T("↑")}${T("↓")}choisir</span><span>${T("←")}${T("→")}changer</span>` : "<span>le créateur règle la partie</span>")
    + `<span>${T("Espace")}quitter</span>`;
  const cases = joueurs.map((j) => `<div class="place${j.pret ? " pret" : ""}${j.moi ? " moi" : ""}">`
    + `${j.pret ? '<svg width="14" height="14"><use href="#coche"/></svg>' : ""}${nettoyer(j.nom)}</div>`);
  while (cases.length < Math.max(8, joueurs.length + (joueurs.length % 2))) cases.push('<div class="place vide">…</div>');
  $("places").innerHTML = cases.join("");
  montrer("salon", true);
  retracer();
}

// ---------------------------------------------------------------- vision
let etapesVision = [];
function vision(v) {
  etapesVision.forEach(clearTimeout);
  const boite = $("vision"), carte = $("vcarte");
  boite.classList.remove("monte", "part");
  carte.classList.remove("tourne");
  $("vcarte-face").src = `img/${v.image}.png`;
  $("vtitre").textContent = nettoyer(v.titre);
  montrer("vision", true);
  void boite.offsetWidth;
  etapesVision = [
    setTimeout(() => boite.classList.add("monte"), 30),
    setTimeout(() => carte.classList.add("tourne"), 800),
    setTimeout(() => boite.classList.add("part"), 4200),
    setTimeout(() => { montrer("vision", false); boite.classList.remove("monte", "part"); carte.classList.remove("tourne"); }, 4900),
  ];
}

// ---------------------------------------------------------------- annonce
let finAnnonce = null;
function annonce(texte, secondes) {
  clearTimeout(finAnnonce);
  $("annonce").innerHTML = avecRoles(texte);
  $("annonce").classList.toggle("efface", !texte);
  if (texte) finAnnonce = setTimeout(() => $("annonce").classList.add("efface"), (secondes || 5) * 1000);
}

let versCoin = null;
function elimine(oui) {
  clearTimeout(versCoin);
  const e = $("elimine");
  e.classList.remove("coin");
  montrer("elimine", !!oui);
  if (oui) versCoin = setTimeout(() => e.classList.add("coin"), 2600);
}

// ---------------------------------------------------------------- resultat
const IMAGES = { wolf: "loup", white_wolf: "loup_blanc", villager: "villageois", seer: "voyante",
  hunter: "chasseur", guard: "gardien", cupid: "cupidon", witch: "sorciere" };
const pieces = (n) => `${n > 0 ? "+" : ""}${n} pièce${Math.abs(n) > 1 ? "s" : ""}`;
function resultat(r) {
  if (!r) { montrer("resultat", false); return; }
  $("res-titre").textContent = r.gagne ? "Victoire" : "Défaite";
  $("res-titre").classList.toggle("defaite", !r.gagne);
  let sous = `${nettoyer(r.titre)} Tu étais ${nettoyer(r.nom_role)}.`;
  if (r.gain != null) sous += ` <span class="${r.gain >= 0 ? "plus" : "moins"}">${pieces(r.gain)}</span>`;
  if (r.mise) sous += ` (mise : ${r.mise})`;
  $("res-sous").innerHTML = sous;
  const joueurs = (r.joueurs || []).map((j, i) => `<div class="res-j${j.gagne ? " gagne" : ""}${j.vivant ? "" : " mort"}">`
    + `<img src="img/${IMAGES[j.role] || "dos_nuit"}.png" alt="">`
    + `<span class="n">${nettoyer(j.nom)}${i + 1 === r.moi ? " (toi)" : ""}</span><span class="r">${nettoyer(j.nom_role)}</span>`
    + (j.gain != null ? `<span class="g ${j.gain >= 0 ? "plus" : "moins"}">${pieces(j.gain)}</span>` : "")
    + `</div>`);
  $("res-joueurs").innerHTML = "<h3>Les joueurs</h3>" + joueurs.join("");
  const recit = (r.recit || []).map((l) => String(l).startsWith("#")
    ? `<h4>${nettoyer(String(l).slice(1))}</h4>` : `<p>${avecRoles(l)}</p>`);
  $("res-recit").innerHTML = "<h3>La partie</h3>" + (recit.join("") || "<p>Rien à raconter.</p>");
  montrer("resultat", true);
  retracer();
}
$("res-fermer").addEventListener("click", () => {
  montrer("resultat", false);
  if (typeof Events !== "undefined") Events.Call("fermer_resultat");
});

function tout_cacher() {
  phase(null); rappel(null); salon(null); message(""); annonce(""); elimine(false);
  montrer("revelation", false);
}

if (typeof Events !== "undefined") {
  Events.Subscribe("lg:phase", phase);
  Events.Subscribe("lg:chrono", chrono);
  Events.Subscribe("lg:rappel", rappel);
  Events.Subscribe("lg:revelation", revelation);
  Events.Subscribe("lg:message", message);
  Events.Subscribe("lg:salon", salon);
  Events.Subscribe("lg:cacher", tout_cacher);
  Events.Subscribe("lg:annonce", annonce);
  Events.Subscribe("lg:vision", vision);
  Events.Subscribe("lg:elimine", elimine);
  Events.Subscribe("lg:resultat", resultat);
  Events.Call("pret");
} else {
  document.body.classList.add("apercu");
  if (location.hash === "#salon") {
    salon({ max: 10, createur: true, villageois: 2,
      joueurs: [{ nom: "Toi", pret: true, moi: true }, { nom: "Ana", pret: true }, { nom: "Ben" }, { nom: "Lou", pret: true }, { nom: "Max" }, { nom: "Inès" }],
      lignes: [{ nom: "Joueurs", valeur: "10", choisie: false }, { nom: "Loups-Garous", image: "loup", valeur: "2", choisie: true },
        { nom: "Loup Blanc", image: "loup_blanc", valeur: "0" }, { nom: "Voyante", image: "voyante", valeur: "1" },
        { nom: "Chasseur", image: "chasseur", valeur: "1" }, { nom: "Gardien", image: "gardien", valeur: "0" },
        { nom: "Cupidon", image: "cupidon", valeur: "0" }, { nom: "Débat", valeur: "3:00" }] });
  } else if (location.hash === "#annonce") {
    annonce("Le village élimine Ana. C'était : [[wolf|Loup-Garou]].", 60);
  } else if (location.hash === "#vision") {
    rappel({ image: "voyante", nom: "Voyante", petit: "Pixel est Loup-Garou\nNino est Villageois" });
    vision({ image: "loup", titre: "Pixel est Loup-Garou" });
  } else if (location.hash === "#resultat") {
    resultat({ gagne: true, titre: "Le village gagne !", nom_role: "Voyante", gain: 42, mise: 50, moi: 1,
      joueurs: [{ nom: "Toi", role: "seer", nom_role: "Voyante", vivant: true, gagne: true, gain: 42 },
        { nom: "Ana", role: "wolf", nom_role: "Loup-Garou", vivant: false, gagne: false, gain: -40 },
        { nom: "Ben", role: "villager", nom_role: "Villageois", vivant: false, gagne: true, gain: 42 },
        { nom: "Lou", role: "witch", nom_role: "Sorcière", vivant: true, gagne: true, gain: 42 }],
      recit: ["#Nuit 1", "Les loups choisissent Ben.", "La voyante sonde Ana : Loup-Garou.", "La sorcière sauve Ben.",
        "#Jour 1", "Personne n'est mort cette nuit.", "Ana est éliminé par le vote du village ([[wolf|Loup-Garou]])."] });
  } else {
  phase({ texte: "Nuit · Les loups choisissent", icone: "lune", duree: 45 });
  revelation({ image: "loup", nom: "Loup-Garou", article: "", allies: "Ton allié : Ana" });
  message("Regarde un joueur et appuie sur [E] pour le désigner", 0);
  }
}
