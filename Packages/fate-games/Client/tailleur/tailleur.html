<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le tailleur</title>
<style>
@font-face { font-family: "Lilita One"; src: url("../vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --papier-clair: #f6eedb; --laiton: #d9b56a; --laiton-fonce: #8a6d3b;
    --ombre: #070a0b; --rouge: #a8322b; --vert: #3d7a4a;
    --common: #b9b2a3; --uncommon: #6fae66; --rare: #4f86c9; --epic: #9c63d1; --legendary: #e0a93b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Lilita One", sans-serif; color: var(--encre); user-select: none; }
body.apercu-navigateur { background: linear-gradient(90deg, #6b5a45, #221b14); }

.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); }
.sk-svg .fond { fill: var(--fond, var(--papier)); }
.sk-svg .trait { fill: none; stroke: var(--bord, var(--encre)); stroke-width: var(--epais, 3.5px); stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--bord, var(--encre)); stroke-width: 1.5px; opacity: .4; }

button { font: inherit; color: var(--encre); cursor: pointer; background: var(--papier-clair);
    border: 2.5px solid var(--encre); border-bottom-width: 5px; border-radius: 8px; padding: 6px 12px 5px; }
button:hover { background: #fff7e6; }
button:active { border-bottom-width: 2.5px; transform: translateY(2.5px); }
button:disabled { opacity: .45; cursor: default; }
button.principal { background: var(--laiton); }

#boutique { position: fixed; right: 26px; top: 26px; bottom: 26px; width: min(1040px, 64vw);
    display: flex; flex-direction: column; padding: 18px 20px 16px; transform: rotate(0.5deg); }
.entete { display: flex; align-items: center; gap: 12px; }
.entete h1 { margin: 0; font-size: 30px; font-weight: 400; flex: 1; }
.solde { display: flex; align-items: center; gap: 6px; font-size: 22px; }
.fermer { width: 38px; height: 38px; padding: 0; font-size: 20px; }

.onglets { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; }
.onglets button { padding: 4px 10px 3px; font-size: 15px; }
.onglets button[aria-pressed="true"] { background: var(--laiton); }

.grille { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    align-content: start; padding: 4px 4px 8px; scrollbar-width: none; }
/* Pas de barre de defilement : la molette suffit (27/09). */
.grille::-webkit-scrollbar { display: none; }
.carte { position: relative; display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 10px;
    background: var(--papier-clair); border: 3px solid var(--rarete); cursor: pointer; text-align: left; }
.carte:hover { transform: translateY(-2px); }
.carte .image { aspect-ratio: 1; border-radius: 7px; overflow: hidden; background: #d9cfba; display: grid; place-items: center; }
.carte .image img { width: 100%; height: 100%; object-fit: cover; }
.carte .image svg { width: 55%; height: 55%; opacity: .45; }
.carte .nom { font-size: 15px; line-height: 1.1; min-height: 33px; }
/* Numero dans la categorie, le meme qu'au mannequin (Shared/cosmetiques.lua). */
.carte .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.carte .bas { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.carte .prix { display: flex; align-items: center; gap: 4px; }
.carte .etiquette { font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 2px solid var(--encre); background: #fff; }
.carte.possede .etiquette { background: #d6ead2; }
/* Porte : cadre laiton epais. Dans le panier : fond laiton, contour d'encre,
   carte un peu soulevee et pastille cochee, bien visibles (27/09). */
.carte.porte { box-shadow: 0 0 0 4px var(--laiton), 0 0 0 7px var(--encre); }
.carte.porte .etiquette { background: var(--laiton); }
.carte.panier { background: var(--laiton); box-shadow: 0 0 0 4px var(--encre); transform: translateY(-4px) scale(1.03); }
.carte.panier .nom, .carte.panier .prix { font-weight: 400; color: var(--encre); }
.carte.panier::after { content: "✓"; position: absolute; top: -10px; right: -10px; width: 34px; height: 34px;
    display: grid; place-items: center; font-size: 22px; color: #fff; background: var(--vert);
    border: 3px solid var(--encre); border-radius: 50%; }
.rarete-bande { height: 5px; border-radius: 3px; background: var(--rarete); }
.aucun { display: grid; place-items: center; font-size: 15px; color: var(--laiton-fonce); }

.panier-zone { margin-top: 10px; border-top: 2.5px dashed rgba(28,33,35,.35); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.puce { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 3px 4px 3px 10px;
    border-radius: 999px; border: 2px solid var(--encre); background: var(--papier-clair); }
.puce button { padding: 0 6px; font-size: 13px; border-width: 2px; border-bottom-width: 2px; border-radius: 999px; }
.vide { color: var(--laiton-fonce); font-size: 14px; }
.total { display: flex; align-items: center; gap: 10px; }
.total .somme { flex: 1; font-size: 20px; display: flex; align-items: center; gap: 6px; }
.total .principal { font-size: 18px; padding: 8px 18px 7px; }
#message { min-height: 20px; font-size: 14px; color: var(--rouge); }
#message.bon { color: var(--vert); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pile" viewBox="0 0 48 48">
    <circle cx="18.5" cy="25.5" r="13.5" fill="#8a6d3b" stroke="#1c2123" stroke-width="2.6"/>
    <circle cx="16" cy="24" r="13.5" fill="#e3c173" stroke="#1c2123" stroke-width="2.8"/>
    <path d="M16 17.2l2 4.4 4.7.4-3.6 3.1 1.1 4.6-4.2-2.5-4.2 2.5 1.1-4.6-3.6-3.1 4.7-.4z" fill="#a8843f" stroke="#1c2123" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>
  <symbol id="cintre" viewBox="0 0 32 32"><path d="M16 11a3 3 0 1 1 3-3M16 11v2L4 22c-1 1 0 3 1 3h22c1 0 2-2 1-3L16 13" fill="none" stroke="#1c2123" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<aside id="boutique" class="sk" data-graine="97" data-rayon="18">
  <div class="entete">
    <h1>Le tailleur</h1>
    <div class="solde"><svg width="30" height="30"><use href="#pile"/></svg><span id="solde">0</span></div>
    <button class="fermer" id="fermer" title="Fermer (Échap)">×</button>
  </div>
  <nav class="onglets" id="onglets"></nav>
  <div class="grille" id="grille"></div>
  <div class="panier-zone">
    <div class="puces" id="puces"></div>
    <div class="total">
      <div class="somme"><svg width="24" height="24"><use href="#pile"/></svg><span id="total">0</span></div>
      <button id="vider">Vider</button>
      <button id="acheter" class="principal">Acheter</button>
    </div>
    <div id="message" role="status"></div>
  </div>
</aside>

<script src="../ui/esquisse.js"></script>
<script>
"use strict";
const Bus = typeof Events !== "undefined" ? Events : { Call: (...a) => console.log(...a), Subscribe: () => {} };
const $ = (id) => document.getElementById(id);
const nettoyer = (s) => String(s == null ? "" : s).replace(/[<>&"]/g, "");
const RARETES = { common: "commun", uncommon: "peu commun", rare: "rare", epic: "épique", legendary: "légendaire" };
const REFUS = { solde: "Solde insuffisant.", non_possede: "Tu ne possèdes pas cette pièce.", base: "Erreur d'enregistrement, réessaie.",
  inconnu: "Pièce inconnue.", possede: "Déjà possédée." };

let categories = [], vue = { solde: 0, articles: [], tenue: {} }, onglet = null;
const panier = new Set();

function article(id) { return vue.articles.find((a) => a.id === id); }

function dessinerOnglets() {
  $("onglets").innerHTML = categories.map((c) =>
    `<button data-cat="${c.id}" aria-pressed="${c.id === onglet}">${nettoyer(c.nom)}</button>`).join("");
}

function carte(a) {
  const etat = a.porte ? "porte" : a.possede ? "possede" : panier.has(a.id) ? "panier" : "";
  const bas = a.porte ? '<span class="etiquette">porté</span>'
    : a.possede ? '<span class="etiquette">à porter</span>'
    : `<span class="prix"><svg width="18" height="18"><use href="#pile"/></svg>${a.prix}</span>`;
  return `<button class="carte ${etat}" data-id="${a.id}" style="--rarete: var(--${nettoyer(a.rarete)})" title="${RARETES[a.rarete] || ""}">
    <div class="image"><img src="img/${nettoyer(a.id)}.png" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('<svg><use href=\\'#cintre\\'/></svg>'))"></div>
    <div class="nom"><b class="num">${String(a.numero || 0).padStart(2, "0")}</b> ${nettoyer(a.nom)}</div>
    <div class="bas">${bas}<span style="color: var(--${nettoyer(a.rarete)}); font-size: 12px">${RARETES[a.rarete] || ""}</span></div>
  </button>`;
}

function dessinerGrille() {
  const liste = vue.articles.filter((a) => a.emplacement === onglet);
  const retirer = `<button class="carte aucun possede${vue.tenue[onglet] === "aucun" ? " porte" : ""}" data-aucun="1" style="--rarete: var(--common)">Rien</button>`;
  $("grille").innerHTML = retirer + liste.map(carte).join("");
}

function dessinerPanier() {
  const ids = [...panier].filter((id) => { const a = article(id); return a && !a.possede; });
  panier.clear(); ids.forEach((id) => panier.add(id));
  const total = ids.reduce((s, id) => s + article(id).prix, 0);
  $("puces").innerHTML = ids.length ? ids.map((id) =>
    `<span class="puce">${nettoyer(article(id).nom)} · ${article(id).prix}<button data-retirer="${id}" aria-label="Retirer">×</button></span>`).join("")
    : '<span class="vide">Clique sur une pièce pour l\'essayer. Ce que tu n\'achètes pas est retiré en sortant.</span>';
  $("total").textContent = total;
  $("acheter").disabled = ids.length === 0 || total > vue.solde;
  $("acheter").textContent = total > vue.solde ? "Solde insuffisant" : "Acheter";
}

function tout() {
  $("solde").textContent = vue.solde;
  dessinerOnglets(); dessinerGrille(); dessinerPanier();
  requestAnimationFrame(habiller);
}

// Essai : la piece de cette categorie qui reste dans le panier (la derniere
// ajoutee), ou rien. Le serveur habille le personnage avec (tailleur:essayer).
function essayerCategorie(emplacement) {
  const restes = [...panier].map(article).filter((a) => a && a.emplacement === emplacement);
  Bus.Call("essayer", emplacement, restes.length ? restes[restes.length - 1].id : "");
}

function message(texte, bon) { $("message").textContent = texte || ""; $("message").className = bon ? "bon" : ""; }

$("onglets").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-cat]"); if (!b) return;
  onglet = b.dataset.cat; dessinerOnglets(); dessinerGrille();
});
$("grille").addEventListener("click", (e) => {
  const b = e.target.closest("button.carte"); if (!b) return;
  if (b.dataset.aucun) { Bus.Call("porter", onglet, "aucun"); return; }
  const a = article(b.dataset.id); if (!a) return;
  if (a.porte) { Bus.Call("porter", a.emplacement, "aucun"); return; }
  if (a.possede) { Bus.Call("porter", a.emplacement, a.id); return; }
  // Pas encore a toi : dans le panier et sur toi, a l'essai.
  if (panier.has(a.id)) panier.delete(a.id); else panier.add(a.id);
  essayerCategorie(a.emplacement);
  dessinerGrille(); dessinerPanier();
});
$("puces").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-retirer]"); if (!b) return;
  const a = article(b.dataset.retirer);
  panier.delete(b.dataset.retirer);
  if (a) essayerCategorie(a.emplacement);
  dessinerGrille(); dessinerPanier();
});
$("vider").addEventListener("click", () => {
  const cats = new Set([...panier].map(article).filter(Boolean).map((a) => a.emplacement));
  panier.clear(); cats.forEach(essayerCategorie);
  dessinerGrille(); dessinerPanier();
});
$("acheter").addEventListener("click", () => {
  if (!panier.size) return;
  Bus.Call("acheter", [...panier]); message("Achat en cours…", true);
});
$("fermer").addEventListener("click", () => Bus.Call("fermer"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") Bus.Call("fermer"); });
// Le papier dessine suit la taille reelle du panneau (fenetre redimensionnee,
// premier affichage avant la taille finale).
new ResizeObserver(() => requestAnimationFrame(habiller)).observe($("boutique"));

Bus.Subscribe("tailleur:ouvrir", (v, cats) => {
  vue = v || vue; categories = cats || categories; panier.clear(); message("");
  if (!onglet || !categories.find((c) => c.id === onglet)) onglet = (categories.find((c) => c.id === "haut") || categories[0] || {}).id;
  tout();
});
Bus.Subscribe("tailleur:etat", (v, refus) => {
  const avant = vue.solde;
  vue = v || vue;
  message(refus ? (REFUS[refus] || "Refusé.") : (vue.solde < avant ? "Merci ! C'est à toi." : ""), !refus);
  tout();
});

if (typeof Events === "undefined") {
  document.body.classList.add("apercu-navigateur");
  categories = [{ id: "cheveux", nom: "Cheveux" }, { id: "visage", nom: "Visage" }, { id: "chapeau", nom: "Chapeau" },
    { id: "haut", nom: "Haut" }, { id: "bas", nom: "Bas" }, { id: "chaussures", nom: "Chaussures" }, { id: "accessoire", nom: "Accessoire" }];
  vue = { solde: 1250, tenue: { haut: "haut_mariniere" }, articles: [
    { id: "haut_mariniere", nom: "T-shirt Marinière", rarete: "uncommon", emplacement: "haut", prix: 400, possede: true, porte: true },
    { id: "haut_hawai", nom: "T-shirt Hawaï", rarete: "epic", emplacement: "haut", prix: 2000 },
    { id: "haut_galaxie", nom: "T-shirt Galaxie", rarete: "legendary", emplacement: "haut", prix: 5000 },
    { id: "haut_pois", nom: "T-shirt Pois pastel", rarete: "common", emplacement: "haut", prix: 150, possede: true },
    { id: "haut_camouflage", nom: "T-shirt Camouflage", rarete: "rare", emplacement: "haut", prix: 900 },
    { id: "haut_kit_tshirt", nom: "T-shirt Creative", rarete: "common", emplacement: "haut", prix: 0, possede: true } ] };
  onglet = "haut"; panier.add("haut_camouflage"); tout();
}
</script>
</body>
</html>
