<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Duel</title>
<style>
@font-face { font-family: "Lilita One"; src: url("../vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --laiton: #d9b56a; --laiton-fonce: #8a6d3b; --ombre: #070a0b; --accent: #b8852a; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Lilita One", sans-serif; color: var(--encre); user-select: none; pointer-events: none; }
body.apercu-navigateur { background: radial-gradient(circle at 50% 30%, #6d8aa6, #2a3a48); }
.cache { display: none !important; }

.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); }
.sk-svg .fond { fill: var(--papier); }
.sk-svg .trait { fill: none; stroke: var(--bord, var(--encre)); stroke-width: var(--epais, 3.5px); stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--bord, var(--encre)); stroke-width: 1.5px; opacity: .4; }

.touche { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box;
    border: 2.5px solid var(--encre); border-bottom-width: 5px; border-radius: 8px; background: #f6eedb; font-size: 17px; line-height: 1; }

/* Panneau d'attente, a gauche : format, mise, les deux camps, les touches. */
#panneau { position: absolute; left: 40px; top: 50%; transform: translateY(-50%) rotate(-1deg);
    width: 300px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
#panneau .ligne { display: flex; align-items: center; gap: 10px; font-size: 24px; }
#camps { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
#camps .vs { font-size: 22px; align-self: center; color: var(--laiton-fonce); }
.camp { display: flex; flex-direction: column; gap: 6px; }
.place { display: flex; align-items: center; gap: 6px; font-size: 17px; padding: 4px 8px; border-radius: 8px;
    background: rgba(28, 33, 35, .07); min-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place.vide { opacity: .45; }
.place.pret { background: var(--laiton); }
.place.moi { outline: 2px solid var(--encre); }
#aide { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 15px; align-items: center; }
#aide span { display: inline-flex; gap: 5px; align-items: center; }
#refus { color: #8a3b1f; font-size: 16px; }

/* Combat */
#viseur { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); }
#touche-marque { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); opacity: 0; }
#touche-marque.vu { animation: marque .25s ease-out; }
@keyframes marque { from { opacity: 1; } to { opacity: 0; } }
#score { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
    padding: 6px 22px; font-size: 34px; }
#score .petit { font-size: 18px; color: var(--laiton-fonce); }
#vie { position: absolute; left: 40px; bottom: 36px; width: 260px; height: 26px; padding: 6px; }
#vie .barre { height: 100%; border-radius: 6px; background: var(--laiton); transition: width .15s ease; }
#balles { position: absolute; right: 40px; bottom: 36px; display: flex; gap: 6px; padding: 10px 14px; align-items: center; }
#balles i { width: 10px; height: 26px; border-radius: 5px 5px 2px 2px; background: var(--laiton); border: 2px solid var(--encre); }
#balles i.vide { background: transparent; opacity: .35; }
#balles .touche { margin-left: 8px; }

#grand { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 120px; color: var(--papier);
    -webkit-text-stroke: 5px var(--encre); paint-order: stroke fill; text-shadow: 6px 7px 0 var(--ombre); }
#bandeau { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) rotate(-1.5deg); padding: 14px 30px;
    display: flex; align-items: center; gap: 14px; font-size: 38px; }

/* Rangee des armes possedees, choix a la molette (hors combat). */
#armes { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 12px; padding: 10px 16px; }
#armes .arme { width: 92px; height: 58px; display: grid; place-items: center; border-radius: 10px;
    border: 2.5px solid transparent; opacity: .55; }
#armes .arme img { max-width: 84px; max-height: 50px; }
#armes .arme.choisie { border-color: var(--accent); background: rgba(217, 181, 106, .25); opacity: 1; }
#armes .molette { width: 22px; height: 32px; border: 2.5px solid var(--encre); border-radius: 11px; position: relative; margin-left: 4px; }
#armes .molette::after { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 8px; margin-left: -2px;
    border-radius: 2px; background: var(--encre); }

#recharge { position: absolute; right: 40px; bottom: 96px; width: 150px; height: 10px; border-radius: 5px;
    background: rgba(28, 33, 35, .45); overflow: hidden; }
#recharge i { display: block; height: 100%; width: 0; background: var(--laiton); }
#voile { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(7, 10, 11, .38) 100%); }
#voile.coup { animation: voile .28s ease-out; }
@keyframes voile { from { opacity: 1; } to { opacity: 0; } }

#spectateur { position: absolute; right: 40px; top: 40%; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; font-size: 16px; }
#spectateur span { display: inline-flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
<symbol id="pile" viewBox="0 0 48 48">
  <path d="M20 32.5a12 4.6 0 0 0 24 0v4.2a12 4.6 0 0 1-24 0z" fill="#8a6d3b" stroke="#1c2123" stroke-width="2.4"/><ellipse cx="32" cy="32.5" rx="12" ry="4.6" fill="#d9b56a" stroke="#1c2123" stroke-width="2.4"/>
  <circle cx="18.5" cy="25.5" r="13.5" fill="#8a6d3b" stroke="#1c2123" stroke-width="2.6"/>
  <circle cx="16" cy="24" r="13.5" fill="#e3c173" stroke="#1c2123" stroke-width="2.8"/>
  <path d="M16 17.2l2 4.4 4.7.4-3.6 3.1 1.1 4.6-4.2-2.5-4.2 2.5 1.1-4.6-3.6-3.1 4.7-.4z" fill="#a8843f" stroke="#1c2123" stroke-width="1.6" stroke-linejoin="round"/>
</symbol>
<symbol id="bonhomme" viewBox="0 0 20 32"><ellipse cx="10" cy="7" rx="5.5" ry="6.5" fill="#f6eedb" stroke="#1c2123" stroke-width="2"/><rect x="3.5" y="14" width="13" height="16" rx="6" fill="#d9b56a" stroke="#1c2123" stroke-width="2"/></symbol>
<symbol id="coche" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1c2123" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="oeil" viewBox="0 0 32 32"><path d="M3 16c4-7 9-10 13-10s9 3 13 10c-4 7-9 10-13 10S7 23 3 16z" fill="#f6eedb" stroke="#1c2123" stroke-width="2.6"/><circle cx="16" cy="16" r="5" fill="#1c2123"/></symbol>
</svg>

<div id="panneau" class="sk cache" data-graine="7" data-rayon="16">
  <div class="ligne"><span id="format"></span><span style="flex: 1"></span><svg width="30" height="30" aria-hidden="true"><use href="#pile"/></svg><span id="mise"></span></div>
  <div id="camps"><div class="camp" id="camp1"></div><div class="vs">×</div><div class="camp" id="camp2"></div></div>
  <div id="aide"></div>
  <div id="refus" class="cache"></div>
</div>

<svg id="viseur" class="cache" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="2.4" fill="#efe6d2" stroke="#1c2123" stroke-width="1.6"/><path d="M14 2v6M14 20v6M2 14h6M20 14h6" stroke="#1c2123" stroke-width="4" stroke-linecap="round"/><path d="M14 2v6M14 20v6M2 14h6M20 14h6" stroke="#efe6d2" stroke-width="1.8" stroke-linecap="round"/></svg>
<svg id="touche-marque" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 8l9 9M36 8l-9 9M8 36l9-9M36 36l-9-9" stroke="#b8852a" stroke-width="4.5" stroke-linecap="round"/></svg>

<div id="score" class="sk cache" data-graine="13" data-rayon="999"><span id="s1">0</span><span class="petit" id="manche"></span><span id="s2">0</span></div>
<div id="vie" class="sk cache" data-graine="19" data-rayon="12"><div class="barre" id="barre" style="width: 100%"></div></div>
<div id="balles" class="sk cache" data-graine="29" data-rayon="14"></div>

<div id="armes" class="sk cache" data-graine="53" data-rayon="16"></div>
<div id="recharge" class="cache"><i id="recharge-barre"></i></div>
<div id="voile"></div>
<div id="grand" class="cache"></div>
<div id="bandeau" class="sk cache" data-graine="31" data-rayon="18"></div>

<div id="spectateur" class="sk cache" data-graine="43" data-rayon="14">
  <span><span class="touche">F</span><svg width="28" height="28" aria-hidden="true"><use href="#oeil"/></svg></span>
  <span id="spect-stop" class="cache"><span class="touche">G</span>×</span>
</div>

<script src="../ui/esquisse.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let etat = null, moi = null, balles = 6, chargeur = 6, spectateur = false, regarde = false;
let armes = [], choisie = null;

function montrer(id, oui) { $(id).classList.toggle("cache", !oui); }
function bonhommes(n) { return Array.from({ length: n }, () => '<svg width="16" height="26" aria-hidden="true"><use href="#bonhomme"/></svg>').join(""); }

function dessinerPanneau() {
  const e = etat;
  const dedans = e && e.joueurs.some((j) => j.id === moi);
  const attente = e && e.phase === "attente";
  montrer("panneau", !!(attente && dedans));
  if (!(attente && dedans)) return;
  $("format").innerHTML = `${bonhommes(e.format)}<span style="margin: 0 4px">×</span>${bonhommes(e.format)}`;
  $("mise").textContent = e.mise;
  for (const camp of [1, 2]) {
    const membres = e.joueurs.filter((j) => j.camp === camp);
    const places = [];
    for (let i = 0; i < e.format; i++) {
      const j = membres[i];
      if (!j) { places.push('<div class="place vide">…</div>'); continue; }
      const nom = String(j.nom).replace(/[<>&]/g, "");
      places.push(`<div class="place${j.pret ? " pret" : ""}${j.id === moi ? " moi" : ""}">${j.pret ? '<svg width="16" height="16"><use href="#coche"/></svg>' : ""}${nom}</div>`);
    }
    $("camp" + camp).innerHTML = places.join("");
  }
  const createur = e.createur === moi;
  $("aide").innerHTML =
    '<span><span class="touche">R</span><svg width="18" height="18"><use href="#coche"/></svg></span>' +
    (createur ? '<span><span class="touche">←</span><span class="touche">→</span><svg width="22" height="22"><use href="#pile"/></svg></span>' : "");
  requestAnimationFrame(habiller);
}

function dessinerCombat() {
  const e = etat;
  const moiJ = e && e.joueurs.find((j) => j.id === moi);
  const actif = e && (e.phase === "combat" || e.phase === "entre_manches" || e.phase === "decompte");
  const combat = !!(moiJ && !moiJ.parti && actif);
  montrer("score", !!actif && (combat || regarde));
  montrer("viseur", combat && e.phase === "combat" && moiJ.vivant);
  montrer("vie", combat);
  montrer("balles", combat);
  if (actif) {
    $("s1").textContent = e.scores[0];
    $("s2").textContent = e.scores[1];
    $("manche").textContent = e.manche > 0 ? `${e.manche}` : "";
  }
  spectateur = !!actif && !moiJ;
  montrer("spectateur", spectateur);
  montrer("spect-stop", regarde);
  dessinerBalles();
  requestAnimationFrame(habiller);
}

function dessinerArmes() {
  const e = etat;
  const dedans = e && e.joueurs.some((j) => j.id === moi && !j.parti);
  const hors_combat = e && (e.phase === "attente" || e.phase === "decompte" || e.phase === "entre_manches");
  montrer("armes", !!(dedans && hors_combat && armes.length));
  if (!(dedans && hors_combat)) return;
  $("armes").innerHTML = armes.map((a) =>
    `<div class="arme${a.id === choisie ? " choisie" : ""}"><img src="../vestiaire/img/armes/encre_${a.rendu}.png" alt=""></div>`).join("") +
    (armes.length > 1 ? '<span class="molette" aria-hidden="true"></span>' : "");
  requestAnimationFrame(habiller);
}

function dessinerBalles() {
  let h = "";
  for (let i = 0; i < chargeur; i++) h += `<i class="${i < balles ? "" : "vide"}"></i>`;
  if (balles === 0) h += '<span class="touche">R</span>';
  $("balles").innerHTML = h;
}

function bandeau(html, ms) {
  $("bandeau").innerHTML = html;
  montrer("bandeau", true);
  requestAnimationFrame(habiller);
  clearTimeout(bandeau.t);
  bandeau.t = setTimeout(() => montrer("bandeau", false), ms);
}

function decompte(ms) {
  let n = Math.round(ms / 1000);
  montrer("grand", true);
  $("grand").textContent = n;
  clearInterval(decompte.t);
  decompte.t = setInterval(() => {
    n -= 1;
    if (n <= 0) { clearInterval(decompte.t); montrer("grand", false); return; }
    $("grand").textContent = n;
  }, 1000);
}

const api = {
  etat(e, id) { etat = e; moi = id; dessinerPanneau(); dessinerCombat(); dessinerArmes(); },
  armes(liste, id) { armes = liste || []; choisie = id; dessinerArmes(); },
  recharge(ms) {
    const b = $("recharge-barre");
    montrer("recharge", true);
    b.style.transition = "none"; b.style.width = "0";
    void b.offsetWidth;
    b.style.transition = `width ${ms}ms linear`; b.style.width = "100%";
    clearTimeout(api.recharge.t);
    api.recharge.t = setTimeout(() => montrer("recharge", false), ms);
  },
  blesse() { const v = $("voile"); v.classList.remove("coup"); void v.offsetWidth; v.classList.add("coup"); },
  decompte,
  manche(n) { bandeau(`<span class="touche" style="font-size: 26px; height: 40px; min-width: 40px">${n}</span>`, 1500); },
  mancheGagnee(camp) { bandeau(`${bonhommes(1)}<span>${camp === 1 ? "◀" : "▶"}</span>`, 2500); },
  fin(camp, cagnotte, gagne) {
    bandeau(`<svg width="46" height="46"><use href="#pile"/></svg><span>${gagne ? "+" + cagnotte : "−"}</span>`, 4500);
  },
  refus(noms) {
    const r = $("refus");
    r.innerHTML = '<svg width="22" height="22" style="vertical-align: middle"><use href="#pile"/></svg> ' +
      noms.map((n) => String(n).replace(/[<>&]/g, "")).join(", ");
    montrer("refus", true);
    setTimeout(() => montrer("refus", false), 4000);
  },
  munitions(n, max) { balles = n; if (max) chargeur = max; dessinerBalles(); },
  vie(pv, max) { $("barre").style.width = Math.max(0, Math.min(100, (pv / (max || 100)) * 100)) + "%"; },
  touche() { const m = $("touche-marque"); m.classList.remove("vu"); void m.getBoundingClientRect(); m.classList.add("vu"); },
  regarde(oui) { regarde = oui; dessinerCombat(); },
};

if (window.Events) {
  for (const [nom, f] of Object.entries(api)) Events.Subscribe("duel:" + nom, f);
  Events.Call("pret");
} else {
  // Ouverte dans un navigateur : donnees d'exemple. #combat pour le combat.
  document.body.classList.add("apercu-navigateur");
  const combat = location.hash === "#combat";
  api.etat({ phase: combat ? "combat" : "attente", format: 2, mise: 100, createur: 1, scores: [1, 0], manche: 2, capacite: 4,
    joueurs: [{ id: 1, nom: "zixload", camp: 1, pret: true, vivant: true }, { id: 2, nom: "Bob", camp: 2, pret: false, vivant: true },
              { id: 3, nom: "Alice", camp: 1, pret: true, vivant: true }] }, 1);
  if (combat) { api.munitions(4, 6); api.vie(66, 100); }
  else api.armes([{ id: "revolver", rendu: "revolver" }, { id: "canon", rendu: "old" }, { id: "duel", rendu: "lawgiver" }], "canon");
}
</script>
</body>
</html>
