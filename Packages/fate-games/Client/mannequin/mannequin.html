<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mannequin</title>
<style>
@font-face { font-family: "Lilita One"; src: url("../vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --laiton: #d9b56a; --laiton-fonce: #8a6d3b; --ombre: #070a0b; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Lilita One", sans-serif; color: var(--encre); user-select: none; pointer-events: none; }
body.apercu-navigateur { background: radial-gradient(circle at 60% 40%, #6b5a45, #221b14); }

.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); }
.sk-svg .fond { fill: var(--papier); }
.sk-svg .trait { fill: none; stroke: var(--encre); stroke-width: 3.5px; stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--encre); stroke-width: 1.5px; opacity: .4; }

.touche { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 5px; box-sizing: border-box;
    border: 2.5px solid var(--encre); border-bottom-width: 5px; border-radius: 8px; background: #f6eedb; font-size: 14px; }

#panneau { position: absolute; right: 40px; top: 50%; transform: translateY(-50%) rotate(1deg);
    width: 330px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.ligne { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px; font-size: 16px; }
.ligne .cat { color: var(--laiton-fonce); font-size: 14px; }
.ligne .nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne.choisie { background: var(--laiton); }
.ligne.choisie .cat { color: var(--encre); }
.ligne.choisie .nom::before { content: "‹ "; opacity: .6; }
.ligne.choisie .nom::after { content: " ›"; opacity: .6; }
.ligne.vide { opacity: .45; }
.ligne .aucun { opacity: .5; }
.rarete { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--encre); }
.common { background: #e6e1d6; } .uncommon { background: #a8d5a2; } .rare { background: #8fb8e8; }
.epic { background: #c7a2e8; } .legendary { background: #e0a93b; }
#aide { display: flex; gap: 14px; font-size: 14px; align-items: center; margin-top: 8px; }
#aide span { display: inline-flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<div id="panneau" class="sk" data-graine="83" data-rayon="16">
  <div id="lignes"></div>
  <div id="aide">
    <span><span class="touche">↑</span><span class="touche">↓</span>catégorie</span>
    <span><span class="touche">←</span><span class="touche">→</span>changer</span>
  </div>
</div>
<script src="../ui/esquisse.js"></script>
<script>
const nettoyer = (s) => String(s == null ? "" : s).replace(/[<>&]/g, "");
function maj(lignes) {
  document.getElementById("lignes").innerHTML = (lignes || []).map((l) => {
    const nom = l.vide ? '<span class="nom">à venir</span>'
      : (l.nom ? `<span class="nom">${nettoyer(l.nom)}</span>` : '<span class="nom aucun">aucun</span>');
    const rarete = l.rarete ? `<span class="rarete ${nettoyer(l.rarete)}"></span>` : "<span></span>";
    return `<div class="ligne${l.choisie ? " choisie" : ""}${l.vide ? " vide" : ""}"><span class="cat">${nettoyer(l.categorie)}</span>${nom}${rarete}</div>`;
  }).join("");
  requestAnimationFrame(habiller);
}
if (typeof Events !== "undefined") {
  Events.Subscribe("mannequin:maj", maj);
} else {
  document.body.classList.add("apercu-navigateur");
  maj([{ categorie: "Cheveux", nom: "Coiffure bouclée", rarete: "common" }, { categorie: "Visage" },
       { categorie: "Chapeau", vide: true }, { categorie: "Lunettes", nom: "Lunettes rondes", rarete: "common" },
       { categorie: "Barbe" }, { categorie: "Haut", nom: "T-shirt Hawaï", rarete: "epic", choisie: true },
       { categorie: "Bas", nom: "Slim tartan", rarete: "rare" }, { categorie: "Chaussures", nom: "Baskets", rarete: "common" },
       { categorie: "Accessoire", vide: true }]);
}
</script>
</body>
</html>
