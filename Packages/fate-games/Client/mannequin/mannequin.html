<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mannequin</title>
<style>
@font-face { font-family: "Lilita One"; src: url("../vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --laiton: #d9b56a; --laiton-fonce: #8a6d3b; --ombre: #070a0b; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Lilita One", sans-serif; color: var(--encre); user-select: none; pointer-events: none; }
body.apercu-navigateur { background: radial-gradient(circle at 60% 40%, #6b5a45, #221b14); }

.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); }
.sk-svg .fond { fill: var(--papier); }
.sk-svg .trait { fill: none; stroke: var(--encre); stroke-width: 3.5px; stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--encre); stroke-width: 1.5px; opacity: .4; }

.touche { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box;
    border: 2.5px solid var(--encre); border-bottom-width: 5px; border-radius: 8px; background: #f6eedb; font-size: 15px; }

#panneau { position: absolute; right: 40px; top: 50%; transform: translateY(-50%) rotate(1deg);
    width: 360px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 26px; font-weight: 400; }
.ligne { display: flex; flex-direction: column; gap: 3px; }
.tete { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--laiton-fonce); }
.tete .rang { margin-left: auto; font-variant-numeric: tabular-nums; }
.nom { font-size: 21px; }
.tech { font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px; color: #4a4f52; word-break: break-all; }
.rarete { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 2px solid var(--encre); }
.common { background: #e6e1d6; } .uncommon { background: #a8d5a2; } .rare { background: #8fb8e8; }
.epic { background: #c7a2e8; } .legendary { background: var(--laiton); }
#aide { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; align-items: center; }
#aide span { display: inline-flex; gap: 5px; align-items: center; }
</style>
</head>
<body>
<div id="panneau" class="sk" data-graine="83" data-rayon="16">
  <h1>Mannequin</h1>
  <div class="ligne" id="haut"></div>
  <div class="ligne" id="bas"></div>
  <div id="aide">
    <span><span class="touche">←</span><span class="touche">→</span>haut</span>
    <span><span class="touche">↑</span><span class="touche">↓</span>bas</span>
    <span>/mannequin retirer</span>
  </div>
</div>
<script src="../ui/esquisse.js"></script>
<script>
const RARETES = { common: "commun", uncommon: "peu commun", rare: "rare", epic: "épique", legendary: "légendaire" };
const nettoyer = (s) => String(s == null ? "" : s).replace(/[<>&]/g, "");
function ligne(id, titre, v) {
  const el = document.getElementById(id);
  if (!v || !v.nom) { el.innerHTML = `<div class="tete">${titre}<span class="rang">0/${v ? v.total : 0}</span></div>`; return; }
  el.innerHTML = `<div class="tete">${titre}<span class="rarete ${nettoyer(v.rarete)}">${RARETES[v.rarete] || nettoyer(v.rarete)}</span>`
    + `<span class="rang">${v.rang}/${v.total}</span></div>`
    + `<div class="nom">${nettoyer(v.nom)}</div>`
    + `<div class="tech">${nettoyer(v.piece)}<br>${nettoyer(v.materiau)}</div>`;
}
function maj(haut, bas) { ligne("haut", "Haut", haut); ligne("bas", "Bas", bas); requestAnimationFrame(habiller); }
if (typeof Events !== "undefined") {
  Events.Subscribe("mannequin:maj", maj);
} else {
  document.body.classList.add("apercu-navigateur");
  maj({ rang: 12, total: 21, nom: "T-shirt Hawaï", rarete: "epic", piece: "SK_COS_TShirt_Rare_Compass", materiau: "MI_COS_TShirt_M_Hawai" },
      { rang: 7, total: 35, nom: "Slim tartan", rarete: "rare", piece: "SK_COS_Pants_Slim", materiau: "MI_COS_Pants_Tartan" });
}
</script>
</body>
</html>
