<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sprites HUD</title>
<!--
  Sprites du HUD de Liar's Bar au-dessus des tetes, dessines ici dans le
  style croquis puis rendus en PNG (scripts/hud/rendre.sh) : le Canvas natif
  les pose a l'ecran dans la meme image que la camera, sans le retard d'une
  page WebUI. Un sprite par page : sprites.html?s=<nom>&... (voir SPRITES).
-->
<style>
@font-face { font-family: "Lilita One"; src: url("../../Packages/fate-games/Client/vestiaire/fonts/LilitaOne-Regular.ttf") format("truetype"); }
:root { --encre: #1c2123; --papier: #efe6d2; --ombre: #070a0b; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#boite { position: absolute; left: 0; top: 0; display: grid; place-items: center; }
.sk { position: relative; isolation: isolate; }
.sk-svg { position: absolute; z-index: -1; overflow: visible; pointer-events: none; }
.sk-svg .ombre { fill: var(--ombre); opacity: .55; }
.sk-svg .fond { fill: var(--papier); }
.sk-svg .trait { fill: none; stroke: var(--bord, var(--encre)); stroke-width: 3px; stroke-linejoin: round; }
.sk-svg .trait2 { fill: none; stroke: var(--encre); stroke-width: 1.4px; opacity: .4; }

.barrel { position: relative; width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #c5a774; border-radius: 50%;
    background: rgba(19, 25, 27, .88); box-shadow: 0 2px 9px rgba(0, 0, 0, .65), inset 0 0 0 2px rgba(241, 222, 179, .12); }
.barrel::after { content: ""; position: absolute; width: 6px; height: 6px; left: 19px; top: 19px; border-radius: 50%; background: #8e7859; }
.chamber { position: absolute; width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; background: #e8dec8; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
.chamber.spent { background: #e83d37; box-shadow: 0 0 5px rgba(232, 61, 55, .7); }
.chamber:nth-child(1) { left: 18px; top: 5px; } .chamber:nth-child(2) { left: 30px; top: 11px; }
.chamber:nth-child(3) { left: 30px; top: 27px; } .chamber:nth-child(4) { left: 18px; top: 33px; }
.chamber:nth-child(5) { left: 6px; top: 27px; } .chamber:nth-child(6) { left: 6px; top: 11px; }
.arrow { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-top: 13px solid #f03b35; filter: drop-shadow(0 1px 4px rgba(240, 59, 53, .75)); }

.liar { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; font: 18px "Lilita One", sans-serif; color: var(--encre); white-space: nowrap; }
.liar svg.nez { width: 38px; height: 30px; overflow: visible; }
.liar svg.nez path { fill: none; stroke: var(--encre); stroke-width: 2.4px; stroke-linecap: round; stroke-linejoin: round; }
.touche { display: inline-block; min-width: 20px; padding: 2px 5px; text-align: center; box-sizing: border-box;
    border: 2px solid var(--encre); border-bottom-width: 4px; border-radius: 6px; background: #f6eedb; font-size: 15px; line-height: 1; }

.carton { width: 110px; height: 76px; }

/* Loup-Garou : invites, compteurs de voix, marque des loups allies. */
.lg-invite { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; font: 22px "Lilita One", sans-serif; color: var(--encre); white-space: nowrap; }
.lg-invite svg.ico { width: 32px; height: 30px; }
.lg-voix { display: flex; align-items: center; gap: 6px; padding: 5px 13px 5px 9px; font: 26px "Lilita One", sans-serif; color: var(--encre); }
.lg-voix svg.ico { width: 26px; height: 26px; }
.lg-voix.tete { --bord: #b8332d; }
.lg-allie { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #1c2123;
    box-shadow: inset 0 0 0 3px #d9b56a, 0 3px 8px rgba(0, 0, 0, .6); }
.lg-allie { position: relative; overflow: hidden; box-sizing: border-box; border: 3px solid #d9b56a; background: #efe6d2; }
.lg-allie img { position: absolute; width: 78px; left: -18px; top: -30px; }
.texte { font-family: "Lilita One", sans-serif; color: var(--encre); line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
<div id="boite"></div>
<script src="../../Packages/fate-games/Client/ui/esquisse.js"></script>
<script>
const q = new URLSearchParams(location.search);
const boite = document.getElementById("boite");
const GRIFFES = '<svg class="ico" viewBox="0 0 34 30" aria-hidden="true"><path d="M6 26C10 16 14 9 20 3M14 28C18 18 22 11 28 5M22 28c3-6 6-10 10-14" fill="none" stroke="#b8332d" stroke-width="3.4" stroke-linecap="round"/></svg>';
const MAIN = '<svg class="ico" viewBox="0 0 26 26" aria-hidden="true"><path d="M8 24v-9L5 11c-1-2 1-4 3-2l2 3V4c0-2 3-2 3 0v6-8c0-2 3-2 3 0v8-6c0-2 3-2 3 0v11c0 5-2 9-6 9h-2c-2 0-3 0-3 0z" fill="#f6eedb" stroke="#1c2123" stroke-width="2" stroke-linejoin="round"/></svg>';
const BOUCLIER = '<svg class="ico" viewBox="0 0 30 32" aria-hidden="true"><path d="M15 2c5 2 9 3 13 2 1 13-5 21-13 26C7 25 1 17 2 4c4 1 8 0 13-2z" fill="#9fbcb4" stroke="#1c2123" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 8v16M8 13h14" stroke="#1c2123" stroke-width="2.2" stroke-linecap="round"/></svg>';
const COEUR = '<svg class="ico" viewBox="0 0 32 30" aria-hidden="true"><path d="M16 27C6 20 2 15 4 9c2-5 8-5 12 0 4-5 10-5 12 0 2 6-2 11-12 18z" fill="#d98b8b" stroke="#1c2123" stroke-width="2.4" stroke-linejoin="round"/></svg>';
const MIRE = '<svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="#1c2123" stroke-width="2.6"/><circle cx="16" cy="16" r="3" fill="#b8332d"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8" stroke="#1c2123" stroke-width="2.6" stroke-linecap="round"/></svg>';
const OEIL = '<svg class="ico" viewBox="0 0 34 24" aria-hidden="true"><path d="M2 12C8 3 26 3 32 12 26 21 8 21 2 12z" fill="#f6eedb" stroke="#1c2123" stroke-width="2.4" stroke-linejoin="round"/><circle cx="17" cy="12" r="5" fill="#5d7d76" stroke="#1c2123" stroke-width="2"/><circle cx="17" cy="12" r="2" fill="#1c2123"/></svg>';
const MEDAILLE = '<svg class="ico" viewBox="0 0 30 34" aria-hidden="true"><path d="M8 1l6 13M22 1l-6 13" stroke="#1c2123" stroke-width="7" stroke-linecap="round"/><path d="M8 1l6 13M22 1l-6 13" stroke="#5b728c" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="22" r="10" fill="#d9b56a" stroke="#1c2123" stroke-width="2.4"/><path d="M15 15.5l2 4.2 4.6.5-3.4 3.1 1 4.5-4.2-2.4-4.2 2.4 1-4.5-3.4-3.1 4.6-.5z" fill="#8a6d3b" stroke="#1c2123" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const FIOLE = '<svg class="ico" viewBox="0 0 28 32" aria-hidden="true"><path d="M11 3h6v7c6 2 9 6 9 11 0 6-5 9-12 9S2 27 2 21c0-5 3-9 9-11z" fill="#9fbcb4" stroke="#1c2123" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 1h10" stroke="#8a6d3b" stroke-width="3.4" stroke-linecap="round"/></svg>';
const POISON = '<svg class="ico" viewBox="0 0 26 34" aria-hidden="true"><path d="M10 2h6v7c5 2 8 5 8 10v11c0 2-1 3-3 3H5c-2 0-3-1-3-3V19c0-5 3-8 8-10z" fill="#9a86b5" stroke="#1c2123" stroke-width="2.4" stroke-linejoin="round"/><circle cx="13" cy="21" r="4.5" fill="#f6eedb" stroke="#1c2123" stroke-width="1.8"/><circle cx="11.4" cy="20.6" r="1.2" fill="#1c2123"/><circle cx="14.6" cy="20.6" r="1.2" fill="#1c2123"/></svg>';
const NEZ = '<svg class="nez" viewBox="0 0 38 30" aria-hidden="true">'
  + '<path d="M13 3c-6 1-10 6-10 12s4 11 10 12c2 0 3-1 4-2"/><path d="M13 11c1 0 2 1 2 2"/>'
  + '<path d="M16 16c6-1 13-2 20-2"/><path d="M16 19c6 0 12-1 19-3"/><path d="M9 22c2 1 4 1 6 0"/></svg>';

// Chaque sprite : taille de la fenetre (px, a l'echelle 1) et contenu.
const SPRITES = {
  barillet: () => {
    const n = Number(q.get("n") || 0);
    let h = '<div class="barrel">';
    for (let i = 0; i < 6; i++) h += `<i class="chamber${i < n ? " spent" : ""}"></i>`;
    return [64, 64, h + "</div>"];
  },
  fleche: () => [28, 24, '<div class="arrow"></div>'],
  menteur: () => [186, 66, `<div class="liar sk" data-graine="11" data-rayon="14">${NEZ}<span class="touche">R</span><span>Menteur !</span></div>`],
  carton: () => [132, 98, '<div class="carton sk" data-graine="23" data-rayon="12"></div>'],
  // Loup-Garou
  lg_designer: () => [196, 62, `<div class="lg-invite sk" data-graine="63" data-rayon="14">${GRIFFES}<span class="touche">E</span>Désigner</div>`],
  lg_voter: () => [170, 62, `<div class="lg-invite sk" data-graine="73" data-rayon="14">${MAIN}<span class="touche">E</span>Voter</div>`],
  lg_voix: () => {
    const n = Number(q.get("n") || 0), tete = q.get("tete") ? " tete" : "";
    return [96, 56, `<div class="lg-voix sk${tete}" data-graine="${75 + n}" data-rayon="999">${MAIN}${n}</div>`];
  },
  lg_proteger: () => [192, 62, `<div class="lg-invite sk" data-graine="81" data-rayon="14">${BOUCLIER}<span class="touche">E</span>Protéger</div>`],
  lg_lier: () => [150, 62, `<div class="lg-invite sk" data-graine="83" data-rayon="14">${COEUR}<span class="touche">E</span>Lier</div>`],
  lg_tirer: () => [158, 62, `<div class="lg-invite sk" data-graine="85" data-rayon="14">${MIRE}<span class="touche">E</span>Tirer</div>`],
  lg_sonder: () => [176, 62, `<div class="lg-invite sk" data-graine="87" data-rayon="14">${OEIL}<span class="touche">E</span>Sonder</div>`],
  lg_coeur: () => [56, 52, `<div style="display:grid;place-items:center;width:48px;height:44px">${COEUR.replace('class="ico"', 'class="ico" style="width:44px;height:40px;filter:drop-shadow(3px 4px 0 rgba(7,10,11,.7))"')}</div>`],
  lg_elire: () => [160, 62, `<div class="lg-invite sk" data-graine="89" data-rayon="14">${MEDAILLE}<span class="touche">E</span>Élire</div>`],
  lg_nommer: () => [178, 62, `<div class="lg-invite sk" data-graine="91" data-rayon="14">${MEDAILLE}<span class="touche">E</span>Nommer</div>`],
  lg_maire: () => [56, 60, `<div style="display:grid;place-items:center;width:50px;height:54px">${MEDAILLE.replace('class="ico"', 'class="ico" style="width:44px;height:50px;filter:drop-shadow(3px 4px 0 rgba(7,10,11,.7))"')}</div>`],
  lg_sauver: () => [170, 62, `<div class="lg-invite sk" data-graine="93" data-rayon="14">${FIOLE}<span class="touche">E</span>Sauver</div>`],
  lg_empoisonner: () => [226, 62, `<div class="lg-invite sk" data-graine="95" data-rayon="14">${POISON}<span class="touche">E</span>Empoisonner</div>`],
  lg_victime: () => [56, 52, `<div style="display:grid;place-items:center;width:50px;height:46px">${GRIFFES.replace('class="ico"', 'class="ico" style="width:44px;height:40px;filter:drop-shadow(2px 3px 0 rgba(7,10,11,.8))"')}</div>`],
  lg_allie: () => [62, 62, '<div class="lg-allie"><img src="../../art/cartes/lg_loup.png" alt=""></div>'],
  texte: () => {
    const t = q.get("t") || "", taille = Number(q.get("taille") || 17), l = Number(q.get("l") || 110), h = Number(q.get("h") || 24);
    const op = q.get("pale") ? "opacity:.7;" : "";
    return [l, h, `<div class="texte" style="font-size:${taille}px;${op}">${t.replace(/[<>&]/g, "")}</div>`];
  },
};

document.fonts.load('18px "Lilita One"').then(() => {
  const [w, h, html] = (SPRITES[q.get("s")] || SPRITES.fleche)();
  boite.style.width = w + "px"; boite.style.height = h + "px";
  boite.innerHTML = html;
  habiller();
});
</script>
</body>
</html>
