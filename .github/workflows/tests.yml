name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    name: banc de test hors-jeu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Lua 5.4 : la meme version que la VM du moteur nanos world.
      # Des tests verts sous une autre version ne garantiraient rien.
      - name: installer Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 -v

      # Les bouchons remplacent les globales du moteur, donc aucun serveur
      # n'est necessaire. Code de sortie 1 si un test echoue.
      - name: lancer les tests
        run: lua5.4 tests/run.lua
